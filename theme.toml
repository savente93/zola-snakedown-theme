name        = "Snakedown"
description = "A theme for hosting python documentation and API references"
# An optional tags to allow quick search
tags     = ["docs", "python", "api"]
license  = "MIT"
homepage = "https://github.com/aslowwriter/zola-snakedown-theme"
# The minimum version of Zola required
min_version = "0.21.0"

# Any variable there can be overridden in the end user `config.toml`
# You don't need to prefix variables by the theme name but as this will
# be merged with user data, some kind of prefix or nesting is preferable
# Use snake_casing to be consistent with the rest of Zola
[extra]

# The theme author info: you!
[author]
name     = "Sam Vente"
homepage = "https://slowcoder.org"

# If this is porting a theme from another static site engine, provide
# the info of the original author here
[original]
author   = "PyData Community"
homepage = "https://pydata-sphinx-theme.readthedocs.io/en/stable/"
repo     = "https://github.com/pydata/pydata-sphinx-theme"
